<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>村庄 · 人物与记忆</title>
  <link rel="stylesheet" href="/runtime-village.css">
  <script type="module" src="/runtime-village.mjs"></script>
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">NARRAVERSE · 地点场景</p><h1>村庄日常</h1><p class="intro">同地点的人物，以及他们亲历的收粮记忆。</p></div>
    <nav aria-label="场景导航"><a href="/runtime-map.html">返回世界地图</a><a id="village-forest-link" href="/runtime-encounter.html" hidden>查看森林场景</a></nav>
  </header>
  <p id="village-status" role="status" aria-live="polite">正在读取村庄读数…</p>
  <section class="readings" aria-label="我的世界读数">
    <article><h2>世界修订</h2><p><strong id="village-revision">—</strong></p><small>时刻 <span id="village-tick">—</span> tick</small></article>
    <article><h2>我的口粮</h2><p><strong id="village-food">—</strong> <span>份</span></p><small>赠粮使用本人的私有口粮</small></article>
    <article><h2>我的位置</h2><p id="village-location">—</p><small id="village-life">正在读取…</small></article>
  </section>
  <section class="world-actions" aria-label="读取与旅行">
    <button id="village-refresh" type="button">刷新场景读数</button>
    <button id="village-travel" type="button" disabled>前往森林 · 12 tick</button>
    <p>旅行耗时 12 tick；查看页面和刷新不会推进时间。</p>
  </section>
  <section aria-labelledby="village-people-title">
    <div class="section-title"><h2 id="village-people-title">同地点人物</h2><span>公开身份与可观察状态</span></div>
    <ul id="village-people" aria-label="同地点人物与本人收粮记忆"><li>尚未取得一致读数。</li></ul>
  </section>
  <section class="command-panel" aria-labelledby="village-command-title">
    <h2 id="village-command-title">操作回执</h2>
    <p id="village-command-status" role="status" aria-live="polite">只有明确点击赠粮或旅行，才会提交世界请求。</p>
    <button id="village-retry" type="button" hidden>重试同一请求</button>
    <details id="village-receipt-details" hidden><summary>查看收据</summary><pre id="village-receipt" hidden aria-label="真实服务回执"></pre></details>
  </section>
</main>
</body>
</html>
