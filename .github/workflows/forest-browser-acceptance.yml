name: Forest browser acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: forest-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      NPC_LLM_ENABLED: 'false'
      FOREST_TEST_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Select a preinstalled browser
        run: node scripts/forest-browser-ci.mjs select
      - name: Run the actual browser journey
        run: node scripts/verify-forest-playtest.mjs artifacts/forest-browser-ci
      - name: Print source-bound text evidence
        if: always()
        run: node scripts/forest-browser-ci.mjs report artifacts/forest-browser-ci
