name: Issue 3 bounded synthetic attribution
on:
  push:
    branches:
      - codex/issue-3-phase-attribution
      - codex/issue-3-primitive-encoding
      - codex/issue-3-number-encoding
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue3-attribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check diagnostics syntax
        run: node --check scripts/measure-issue3-fixture.mjs
      - name: Focused scene service smoke
        run: node --test --test-name-pattern='CP2a-S1 ' tests/simulation/scene-gift-service.test.mjs
      - name: Primitive encoder direct regression tests
        run: node --test tests/simulation/canonical-primitive-fast.test.mjs
      - name: Numeric finite conversion regression
        run: node --test tests/simulation/canonical-number-fast.test.mjs
      - name: Journal tamper rejection smoke
        run: node --test --test-name-pattern='CP2a-S7 ' tests/simulation/scene-gift-service.test.mjs
      - name: Same-process canonical encoder A/B
        run: node scripts/bench-issue3-primitive.mjs
      - name: Same-runner service audit and reopen A B B A
        run: node scripts/compare-issue3-runtime.mjs
      - name: Synthetic bounded attribution
        run: node scripts/measure-issue3-fixture.mjs --profile
