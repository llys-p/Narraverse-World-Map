name: Issue 3 bounded synthetic attribution
on:
  push:
    branches:
      - codex/issue-3-phase-attribution
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue3-attribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check diagnostics syntax
        run: node --check scripts/measure-issue3-fixture.mjs
      - name: Focused scene service smoke
        run: node --test --test-name-pattern='CP2a-S1 ' tests/simulation/scene-gift-service.test.mjs
      - name: Synthetic bounded attribution
        run: node scripts/measure-issue3-fixture.mjs --profile
